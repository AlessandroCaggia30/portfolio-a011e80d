<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word-like — MindNotes Writer</title>
<style>
  :root{
    --bg:#f3f4f6; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280;
    --line:#e5e7eb; --accent:#e08635; --accent-ink:#b3560f;
    --d1:#1a9850; --d2:#91cf60; --d3:#d9ef8b; --d4:#fee08b; --d5:#fc8d59; --d6:#d73027;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;cursor:pointer}
  .hidden{display:none !important}

  #app{display:grid;grid-template-columns:250px 1fr 340px;height:100vh}
  .col{height:100vh;overflow:auto;background:var(--panel)}
  #tree{border-right:1px solid var(--line)}
  #ai{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  #center{background:var(--bg);display:flex;flex-direction:column}

  /* sidebar */
  .side-head{display:flex;align-items:center;gap:6px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
  .side-head b{font-size:14px;flex:1}
  .mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 8px;font-size:12px;color:var(--ink)}
  .mini:hover{background:#f9fafb}
  #treeList{padding:6px}
  .node{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;font-size:13.5px;user-select:none}
  .node:hover{background:#f3f4f6}
  .node.sel{background:#fde6d5}
  .node .tw{width:14px;text-align:center;color:var(--muted);cursor:pointer}
  .node .ic{width:16px;text-align:center}
  .node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .node .dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
  .children{margin-left:14px;border-left:1px dashed var(--line);padding-left:4px}

  /* toolbar */
  #toolbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  .tb{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:30px;height:30px;padding:0 8px;font-size:13px}
  .tb:hover{background:#f3f4f6}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .swatch{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.2);position:relative}
  .dlabel{font-size:11px;color:var(--muted);margin-right:2px}

  /* editor */
  #pageWrap{flex:1;overflow:auto;padding:28px 0}
  #page{max-width:760px;margin:0 auto;background:#fff;min-height:900px;padding:64px 72px;border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);line-height:1.6;font-size:16px;outline:none}
  #page:empty::before{content:attr(data-ph);color:#b8bcc4}
  #page h1{font-size:26px;margin:.4em 0 .3em}
  #page h2{font-size:21px;margin:.5em 0 .3em}
  #page h3{font-size:18px;margin:.6em 0 .3em}
  #page p{margin:.5em 0}
  #page table{border-collapse:collapse;margin:.6em 0}
  #page td{border:1px solid #cbd2da;padding:6px 10px;min-width:60px}

  /* AI panel */
  .ai-head{padding:12px;border-bottom:1px solid var(--line);background:var(--panel)}
  .ai-head b{font-size:14px}
  .ai-status{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.45}
  .ai-status a{color:var(--accent-ink)}
  .loadbtn{margin-top:8px;display:block;width:100%;border:1px solid var(--accent);background:#fff5ec;color:var(--accent-ink);border-radius:8px;padding:8px;font-size:12.5px;font-weight:600}
  .loadbtn:hover{background:#fde9d6}
  .ai-tabs{display:flex;gap:6px;margin-top:10px}
  .ai-tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;line-height:1.15;color:var(--ink)}
  .ai-tab small{display:block;font-size:10px;font-weight:500;opacity:.7;margin-top:2px}
  .ai-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .pane{flex:1;display:flex;flex-direction:column;min-height:0}
  .ai-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

  /* chat */
  #chatThread{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:90%;padding:8px 11px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
  .msg.bot{align-self:flex-start;background:#f1f3f5;border-bottom-left-radius:3px}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:11.5px;font-style:italic;text-align:center}
  .chat-input{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
  .chat-input textarea{flex:1;resize:none;height:44px;border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit;font-size:13px}

  /* suggest */
  #suggestPane{overflow:auto;padding:12px;gap:10px}
  #suggestPane > div{margin-bottom:10px}
  textarea#rubric{width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12.5px}
  .modes{display:flex;gap:6px}
  .mode{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;font-size:12.5px;text-align:center}
  .mode.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .go{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-weight:600}
  .go:hover{background:var(--accent-ink)} .go:disabled{opacity:.5;cursor:default}
  .cards{display:flex;flex-direction:column;gap:8px}
  .card{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;font-size:12.5px}
  .card .q{color:var(--muted);font-style:italic;border-left:3px solid var(--line);padding-left:7px;margin:4px 0}
  .card .cta{display:flex;gap:6px;margin-top:7px}
  .card .cta button{flex:1;border-radius:7px;border:1px solid var(--line);background:#fff;padding:5px;font-size:12px}
  .card .acc{background:#e6f4ea;border-color:#8bd3a3} .card .rej{background:#fdeaea;border-color:#f0a6a6}
  .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;color:#fff;background:var(--muted);border-radius:5px;padding:1px 6px}
  .tag.content{background:#3b82f6}.tag.layout{background:#8b5cf6}
  .legend{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:4px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <!-- TREE -->
  <div class="col" id="tree">
    <div class="side-head">
      <b>📁 Word-like</b>
      <button class="mini" id="newFolder">+ Folder</button>
      <button class="mini" id="newDoc">+ Doc</button>
    </div>
    <div id="treeList"></div>
  </div>

  <!-- EDITOR -->
  <div class="col" id="center">
    <div id="toolbar">
      <button class="tb" data-cmd="formatBlock" data-val="H1">H1</button>
      <button class="tb" data-cmd="formatBlock" data-val="H2">H2</button>
      <button class="tb" data-cmd="formatBlock" data-val="H3">H3</button>
      <button class="tb" data-cmd="formatBlock" data-val="P">¶</button>
      <span class="sep"></span>
      <button class="tb" data-cmd="bold"><b>B</b></button>
      <button class="tb" data-cmd="italic"><i>I</i></button>
      <button class="tb" data-cmd="underline"><u>U</u></button>
      <button class="tb" data-cmd="insertUnorderedList">• List</button>
      <button class="tb" data-cmd="insertOrderedList">1. List</button>
      <button class="tb" id="tblBtn">⊞ Table</button>
      <span class="sep"></span>
      <span class="dlabel">Difficulty</span>
      <span id="swatches"></span>
      <button class="tb" id="clearDiff" title="Remove difficulty color">⌫</button>
    </div>
    <div id="pageWrap">
      <div id="page" contenteditable="true" spellcheck="true"
           data-ph="Select a document, or create one. Start typing…"></div>
    </div>
  </div>

  <!-- AI -->
  <div class="col" id="ai">
    <div class="ai-head">
      <b>✦ AI assistant</b>
      <div class="ai-status" id="aiStatus"></div>
      <button class="loadbtn" id="loadBtn">⬇ Load local AI model</button>
      <div class="ai-tabs">
        <button class="ai-tab on" data-tab="chat">💬 Chat<small>understand</small></button>
        <button class="ai-tab" data-tab="suggest">✍️ Suggest<small>revise</small></button>
      </div>
    </div>
    <div class="ai-body">
      <!-- CHAT (understanding) -->
      <div class="pane" id="chatPane">
        <div id="chatThread"></div>
        <div class="chat-input">
          <textarea id="chatInput" placeholder="Ask about this document — e.g. 'explain this proof' …"></textarea>
          <button class="go" id="chatSend" style="width:64px">Send</button>
        </div>
      </div>
      <!-- SUGGEST (revision) -->
      <div class="pane hidden" id="suggestPane">
        <div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:4px">What should I optimise for? (rubric)</div>
          <textarea id="rubric" placeholder="e.g. Clear section / subsection structure. Main concepts in bold orange. Short sentences."></textarea>
        </div>
        <div class="modes">
          <div class="mode on" data-mode="content">Content<br><span style="font-size:10px;opacity:.8">sentence-by-sentence</span></div>
          <div class="mode" data-mode="layout">Layout<br><span style="font-size:10px;opacity:.8">structure &amp; color</span></div>
        </div>
        <button class="go" id="suggestBtn">Suggest revisions</button>
        <div class="legend" id="diffLegend"></div>
        <div class="cards" id="cards"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== MindNotes Writer =====
   tree (localStorage) · rich-text editor · 6-level difficulty highlighter
   AI: two modes — Chat (understand) & Suggest (revise). Local WebLLM engine. */

const DIFF_COLORS=['--d1','--d2','--d3','--d4','--d5','--d6'].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const DIFF_LABELS=['1 · easiest','2','3','4','5','6 · hardest'];
const LS_KEY='mindnotes_writer_v1';
let store=load(), openId=store.openId||null, mode='content';

function load(){try{return JSON.parse(localStorage.getItem(LS_KEY))||seed();}catch(e){return seed();}}
function seed(){return{tree:[{id:id(),type:'folder',name:'My documents',open:true,children:[{id:id(),type:'doc',name:'Untitled',content:''}]}],openId:null};}
function save(){store.openId=openId;localStorage.setItem(LS_KEY,JSON.stringify(store));}
function id(){return 'n'+Math.random().toString(36).slice(2,9);}
function walk(nodes,fn){for(const n of nodes){fn(n);if(n.children)walk(n.children,fn);}}
function find(i){let r=null;walk(store.tree,n=>{if(n.id===i)r=n;});return r;}
function findParentList(i){let list=null;(function rec(nodes){for(const n of nodes){if(n.id===i)list=nodes;if(n.children)rec(n.children);}})(store.tree);return list;}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* tree */
const treeList=document.getElementById('treeList');
function renderTree(){
  treeList.innerHTML='';
  (function build(nodes,container){
    for(const n of nodes){
      const row=document.createElement('div');
      row.className='node'+(n.id===openId?' sel':'');
      const isF=n.type==='folder';
      row.innerHTML=`<span class="tw">${isF?(n.open?'▾':'▸'):''}</span><span class="ic">${isF?'📁':'📄'}</span><span class="nm">${escapeHtml(n.name)}</span>${isF?'':'<span class="dot"></span>'}`;
      row.querySelector('.tw').onclick=e=>{e.stopPropagation();if(isF){n.open=!n.open;save();renderTree();}};
      row.querySelector('.nm').onclick=()=>{if(isF){n.open=!n.open;save();renderTree();}else openDoc(n.id);};
      row.querySelector('.nm').ondblclick=()=>renameNode(n);
      row.oncontextmenu=e=>{e.preventDefault();nodeMenu(n);};
      container.appendChild(row);
      if(isF){const kids=document.createElement('div');kids.className='children'+(n.open?'':' hidden');container.appendChild(kids);build(n.children,kids);}
    }
  })(store.tree,treeList);
}
function nodeMenu(n){
  const a=prompt(`"${n.name}" — action:\n r=rename  d=delete  f=new subfolder  n=new doc inside`,'');
  if(!a)return;
  if(a==='r')renameNode(n);
  else if(a==='d')deleteNode(n);
  else if(a==='f'&&n.type==='folder'){n.open=true;n.children.push({id:id(),type:'folder',name:'New folder',open:true,children:[]});save();renderTree();}
  else if(a==='n'&&n.type==='folder'){n.open=true;const d={id:id(),type:'doc',name:'Untitled',content:''};n.children.push(d);save();renderTree();openDoc(d.id);}
}
function renameNode(n){const v=prompt('Rename:',n.name);if(v&&v.trim()){n.name=v.trim();save();renderTree();}}
function deleteNode(n){if(!confirm(`Delete "${n.name}"${n.children?' and everything inside':''}?`))return;const l=findParentList(n.id);l.splice(l.indexOf(n),1);if(openId===n.id){openId=null;page.innerHTML='';}save();renderTree();}
function firstFolder(){let f=null;walk(store.tree,n=>{if(!f&&n.type==='folder')f=n;});if(!f){f={id:id(),type:'folder',name:'My documents',open:true,children:[]};store.tree.push(f);}return f;}
document.getElementById('newFolder').onclick=()=>{store.tree.push({id:id(),type:'folder',name:'New folder',open:true,children:[]});save();renderTree();};
document.getElementById('newDoc').onclick=()=>{const f=firstFolder();f.open=true;const d={id:id(),type:'doc',name:'Untitled',content:''};f.children.push(d);save();renderTree();openDoc(d.id);};

/* editor */
const page=document.getElementById('page');
function openDoc(i){saveCurrentDoc();openId=i;const d=find(i);page.innerHTML=d.content||'';save();renderTree();page.focus();}
function saveCurrentDoc(){if(!openId)return;const d=find(openId);if(d)d.content=page.innerHTML;save();}
page.addEventListener('input',()=>{clearTimeout(page._t);page._t=setTimeout(saveCurrentDoc,400);});
document.querySelectorAll('#toolbar .tb[data-cmd]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.val||null);page.focus();saveCurrentDoc();};});
document.getElementById('tblBtn').onclick=()=>{const r=+prompt('Rows?','2')||2,c=+prompt('Columns?','2')||2;let h='<table>';for(let i=0;i<r;i++){h+='<tr>';for(let j=0;j<c;j++)h+='<td>&nbsp;</td>';h+='</tr>';}h+='</table><p><br></p>';document.execCommand('insertHTML',false,h);saveCurrentDoc();};

/* difficulty */
const swWrap=document.getElementById('swatches');
DIFF_COLORS.forEach((col,i)=>{const s=document.createElement('button');s.className='tb swatch';s.style.background=col;s.title='Difficulty '+DIFF_LABELS[i];s.onmousedown=e=>e.preventDefault();s.onclick=()=>{document.execCommand('hiliteColor',false,col);page.focus();saveCurrentDoc();};swWrap.appendChild(s);});
document.getElementById('clearDiff').onclick=()=>{document.execCommand('hiliteColor',false,'transparent');page.focus();saveCurrentDoc();};
document.getElementById('diffLegend').innerHTML='<span style="width:100%;margin-bottom:2px">Difficulty scale (highlight selected text):</span>'+DIFF_COLORS.map((c,i)=>`<span><i style="background:${c}"></i>${DIFF_LABELS[i]}</span>`).join('');

/* =============== AI =============== */
const aiStatus=document.getElementById('aiStatus');
let engine=null;            // {chat: async(messages)=>string}
let chatHistory=[];         // running chat conversation

/* tabs */
document.querySelectorAll('.ai-tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.ai-tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    const chat=t.dataset.tab==='chat';
    document.getElementById('chatPane').classList.toggle('hidden',!chat);
    document.getElementById('suggestPane').classList.toggle('hidden',chat);
  };
});
/* suggest sub-modes */
document.querySelectorAll('.mode').forEach(m=>{m.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));m.classList.add('on');mode=m.dataset.mode;};});

/* status / load */
function setStatus(html){aiStatus.innerHTML=html;}
function refreshStatus(){
  if(engine){ setStatus('Engine: <b>Local model ready</b> — private &amp; offline.'); document.getElementById('loadBtn').classList.add('hidden'); }
  else setStatus('No model loaded yet. <b>Chat</b> needs the model; <b>Suggest</b> works now via quick heuristics.');
}
document.getElementById('loadBtn').onclick=loadWebLLM;

function docContext(){ const t=page.innerText.trim(); return t? t.slice(0,6000): '(the document is empty)'; }

/* ---- CHAT (understanding) ---- */
const chatThread=document.getElementById('chatThread');
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chatThread.appendChild(d);chatThread.scrollTop=chatThread.scrollHeight;return d;}
function bootChat(){ chatThread.innerHTML=''; addMsg('sys','Chat is for understanding the material. Ask about the current document; I can see its text.'); }
document.getElementById('chatSend').onclick=sendChat;
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
async function sendChat(){
  const inp=document.getElementById('chatInput'); const q=inp.value.trim(); if(!q) return;
  if(!engine){ addMsg('sys','Load the local AI model first (button above) to chat.'); return; }
  inp.value=''; addMsg('user',q);
  const thinking=addMsg('bot','…');
  const messages=[
    {role:'system',content:'You are a patient tutor helping the user UNDERSTAND their study notes. Explain clearly, build intuition, use small steps. Here is the current document for reference:\n\n'+docContext()},
    ...chatHistory,
    {role:'user',content:q}
  ];
  try{ const reply=await engine.chat(messages); thinking.textContent=reply; chatHistory.push({role:'user',content:q},{role:'assistant',content:reply}); if(chatHistory.length>12)chatHistory=chatHistory.slice(-12); }
  catch(err){ thinking.textContent='Error: '+err.message; }
}

/* ---- SUGGEST (revision) ---- */
document.getElementById('suggestBtn').onclick=runSuggest;
async function runSuggest(){
  saveCurrentDoc();
  const text=page.innerText.trim(); const cards=document.getElementById('cards'); cards.innerHTML='';
  if(!text){cards.innerHTML='<div class="card">The document is empty.</div>';return;}
  const rubric=document.getElementById('rubric').value.trim();
  const btn=document.getElementById('suggestBtn'); btn.disabled=true; btn.textContent='Thinking…';
  let suggestions;
  try{ suggestions = engine ? await modelSuggest(text,mode,rubric) : heuristic(text,mode,rubric); }
  catch(err){ suggestions=[{type:mode,comment:'AI error: '+err.message}]; }
  btn.disabled=false; btn.textContent='Suggest revisions';
  renderCards(suggestions);
}
async function modelSuggest(text,mode,rubric){
  const sys='You are an editor. Return ONLY a JSON array of at most 6 objects '+
    '{"type":"'+mode+'","comment":"...","quote":"exact snippet from the text or empty","replacement":"improved text or empty"}. '+
    (rubric?('Follow this rubric: '+rubric+'. '):'')+'Mode='+mode+(mode==='content'?' (sentence-level edits).':' (structure / headings / color edits).');
  const raw=await engine.chat([{role:'system',content:sys},{role:'user',content:text.slice(0,6000)}]);
  const m=raw.match(/\[[\s\S]*\]/); return m?JSON.parse(m[0]):[{type:mode,comment:raw.slice(0,300)}];
}
function renderCards(list){
  const cards=document.getElementById('cards'); cards.innerHTML='';
  if(!list.length){cards.innerHTML='<div class="card">No suggestions — looks good.</div>';return;}
  list.forEach(s=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<span class="tag ${s.type||mode}">${s.type||mode}</span> ${escapeHtml(s.comment||'')}`+
      (s.quote?`<div class="q">${escapeHtml(s.quote)}</div>`:'')+
      (s.replacement?`<div style="font-size:12px"><b>→</b> ${escapeHtml(s.replacement)}</div>`:'')+
      `<div class="cta">${s.replacement?'<button class="acc">Accept</button>':''}<button class="rej">Dismiss</button></div>`;
    const acc=c.querySelector('.acc'); if(acc)acc.onclick=()=>{applyReplacement(s.quote,s.replacement);c.remove();};
    c.querySelector('.rej').onclick=()=>c.remove();
    cards.appendChild(c);
  });
}
function applyReplacement(q,r){if(!q||!r)return;const w=document.createTreeWalker(page,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const i=n.nodeValue.indexOf(q);if(i>=0){n.nodeValue=n.nodeValue.slice(0,i)+r+n.nodeValue.slice(i+q.length);saveCurrentDoc();return;}}}
function heuristic(text,mode,rubric){
  const out=[];
  if(mode==='content'){
    text.split(/(?<=[.!?])\s+/).filter(s=>s.trim()).forEach(s=>{
      const w=s.trim().split(/\s+/);
      if(w.length>32)out.push({type:'content',comment:'Long sentence — consider splitting.',quote:trim(s)});
      if(/\b(very|really|clearly|obviously|basically|just)\b/i.test(s))out.push({type:'content',comment:'Filler/hedge word — tighten.',quote:trim(s)});
    });
    if(!out.length)out.push({type:'content',comment:'No obvious sentence-level issues (heuristic). Load the AI model for deeper edits.'});
  }else{
    const html=page.innerHTML;
    if(!/<h[1-3]/i.test(html))out.push({type:'layout',comment:'No headings found — add Section / Subsection headings.'});
    if(page.innerText.length>1200)out.push({type:'layout',comment:'Long text — break into shorter paragraphs.'});
    if(rubric&&/orange/i.test(rubric))out.push({type:'layout',comment:'Rubric: mark main concepts in bold orange — select each key term and apply bold + orange.'});
    if(!out.length)out.push({type:'layout',comment:'Structure looks reasonable (heuristic).'});
  }
  return out;
}
function trim(s){s=s.trim();return s.length>90?s.slice(0,90)+'…':s;}

/* ---- WebLLM loader (shared by chat + suggest) ---- */
async function loadWebLLM(){
  const btn=document.getElementById('loadBtn'); btn.disabled=true;
  if(!('gpu' in navigator)){ setStatus('⚠️ WebGPU not available — Chat needs it. Try Chrome/Edge. Suggest still works via heuristics.'); btn.disabled=false; return; }
  setStatus('Loading local model… downloading weights (one-time, can take a few minutes).');
  try{
    const webllm=await import('https://esm.run/@mlc-ai/web-llm');
    const model='Llama-3.2-3B-Instruct-q4f16_1-MLC';
    const eng=await webllm.CreateMLCEngine(model,{initProgressCallback:p=>setStatus('Loading… '+(p.text||''))});
    engine={ chat: async(messages)=>{ const r=await eng.chat.completions.create({messages,temperature:0.4}); return r.choices[0].message.content; } };
    refreshStatus();
    addMsg('sys','Model loaded — ask away.');
  }catch(err){ setStatus('⚠️ Could not load model ('+err.message+'). Suggest still works via heuristics.'); btn.disabled=false; }
}

/* boot */
renderTree(); if(openId&&find(openId))openDoc(openId);
bootChat(); refreshStatus();
window.addEventListener('beforeunload',saveCurrentDoc);
</script>
